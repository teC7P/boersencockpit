# GitHub schaltet zeitgesteuerte Abläufe in öffentlichen Repositories ab,
# wenn 60 Tage lang nichts passiert. Ein kleiner Eintrag pro Monat verhindert das.
name: Wachhalten

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Wachhalten $(date -u +%Y-%m)" || exit 0
          git push
