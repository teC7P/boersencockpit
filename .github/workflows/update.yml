name: Cockpit aktualisieren

on:
  # Kein Zeitplan: Das Cockpit stößt den Lauf selbst an, wenn die Daten beim Öffnen älter als 20 Minuten sind
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          COCKPIT_PASSWORD: ${{ secrets.COCKPIT_PASSWORD }}
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p site
          cp web/* site/
          # Versionsnummer an CSS/JS hängen, damit Browser nach einer Änderung nicht die alte Datei aus dem Cache nehmen
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/*.html
          if [ -z "$COCKPIT_PASSWORD" ]; then
            python scripts/fetch_data.py --out site/data.json --previous "$BASE/data.json"
            exit 0
          fi
          # Mit Passwort: nur verschlüsselte Daten veröffentlichen
          pip install -q cryptography
          python scripts/seal.py open "$BASE/data.enc.json" prev.json || cp /dev/null prev.json
          [ -s prev.json ] && PREV=prev.json || PREV="$BASE/data.json"
          python scripts/fetch_data.py --out data.json --previous "$PREV"
          python scripts/seal.py close data.json site/data.enc.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
